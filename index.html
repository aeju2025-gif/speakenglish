<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 자동 출제 & Firebase 영어 학습 앱</title>
    <style>
        :root { --primary-color: #4a90e2; --bg-color: #f5f7fa; --card-color: #ffffff; --admin-color: #e53935; }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: var(--bg-color); margin: 0; padding: 30px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .top-bar { max-width: 95%; width: 100%; display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .admin-login-btn { background-color: #78909c; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .container { max-width: 95%; width: 100%; background: var(--card-color); padding: 40px; border-radius: 16px; box-shadow: 0 6px 12px rgba(0,0,0,0.15); box-sizing: border-box; margin-bottom: 20px; }
        h2 { text-align: center; color: #333; margin-top: 0; font-size: 32px; margin-bottom: 20px; }
        .sub-desc { color:#666; font-size:18px; text-align: center; margin-bottom: 25px; }
        .btn { background-color: var(--primary-color); color: white; border: none; padding: 15px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 18px; }
        .btn:hover { opacity: 0.9; }
        .btn-ai { background-color: #8e44ad; width: 100%; } 
        .admin-header { border-bottom: 3px solid var(--admin-color); padding-bottom: 15px; margin-bottom: 25px; color: var(--admin-color); font-size: 32px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 18px; }
        .form-group input, .form-group select { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 18px; }
        .folder-badge { background: #ffebee; color: #c62828; padding: 10px 20px; border-radius: 6px; font-weight: bold; display: inline-block; margin-bottom: 25px; font-size: 18px; }
        .hidden { display: none !important; }
        .expression-list { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .expression-item { background: #e3f2fd; color: #0d47a1; padding: 20px 30px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 22px; border: 1px solid #bbdefb; display: flex; justify-content: space-between; align-items: center; }
        .expression-item:hover { background: #1976d2; color: white; }
        .count-tag { background: rgba(0,0,0,0.1); padding: 4px 12px; border-radius: 16px; font-size: 16px; }
        .card { border: 2px solid #e0e0e0; padding: 60px 40px; border-radius: 12px; text-align: center; margin: 30px 0; background: #fafafa; }
        .sentence { font-size: 36px; line-height: 2.0; letter-spacing: 0.5px; word-break: break-word; color: #222; }
        .meaning { font-size: 26px; color: #555; margin-top: 40px; border-top: 2px dashed #ddd; padding-top: 30px; }
        .expression-highlight { color: #2e7d32; font-weight: bold; border-bottom: 4px solid #4caf50; padding: 0 6px; background-color: #e8f5e9; border-radius: 6px; }
        .blank { display: inline-block; border-bottom: 3px solid #444; color: transparent; padding: 0 6px; margin: 0 4px; cursor: pointer; user-select: none; transition: color 0.1s; }
        .blank:active, .blank.reveal { color: #333333; }
        .nav-btns { display: flex; justify-content: space-between; margin-top: 30px; }
        .back-btn { background: #757575; }
        #page-info { align-self: center; font-weight: bold; font-size: 20px; }
        .loading { display: none; text-align: center; font-size: 20px; color: #8e44ad; font-weight: bold; margin: 15px 0; }
        .action-btn { padding: 6px 12px; font-size: 15px; margin-left: 10px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-edit { background: #ff9800; }
        .btn-delete { background: #ef5350; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button id="auth-btn" class="admin-login-btn" onclick="toggleAdminAuth()">🔒 관리자 로그인</button>
    </div>

    <div id="main-view" class="container">
        <h2>📚 핵심 표현 목록</h2>
        <p class="sub-desc">학습할 핵심 표현을 선택하면 문장 연습이 시작됩니다.</p>
        <div id="loading-data" style="text-align:center; color:#666;">데이터를 불러오는 중입니다...</div>
        <div class="expression-list" id="main-expression-list"></div>
    </div>

    <div id="study-view" class="container hidden">
        <h2 id="study-title">핵심 표현 학습</h2>
        <div class="card">
            <div class="sentence" id="study-sentence"></div>
            <div class="meaning" id="study-meaning"></div>
        </div>
        <p style="text-align:center; font-size:16px; color:#999;">💡 빈칸을 터치하고 있으면 단어가 나타납니다.</p>
        <div class="nav-btns">
            <button class="btn back-btn" onclick="switchView('main')">목록으로</button>
            <span id="page-info">1 / 1</span>
            <button class="btn" id="next-btn" onclick="nextSentence()">다음 문장 ➡️</button>
        </div>
    </div>

    <div id="admin-folder-view" class="container hidden">
        <h2 class="admin-header">🔧 표현 폴더 관리</h2>
        <div class="form-group">
            <label>🔑 API Key (Gemini/OpenAI)</label>
            <input type="password" id="api-key-input" placeholder="sk-... 또는 AI Key" onchange="saveConfig()">
        </div>
        <div class="form-group" style="display:flex; gap:15px;">
            <input type="text" id="new-folder-name" placeholder="새 표현 (예: want to)">
            <button class="btn" onclick="createNewFolder()" style="background:#4caf50;">폴더 생성</button>
        </div>
        <div class="expression-list" id="admin-folder-list"></div>
    </div>

    <div id="admin-register-view" class="container hidden">
        <h2 class="admin-header">📝 문제 등록</h2>
        <div class="folder-badge">현재 폴더: <span id="current-folder-title"></span></div>
        
        <div style="background: #f3e5f5; padding: 20px; border-radius: 12px; margin-bottom: 25px;">
            <label>🤖 AI 모델 선택</label>
            <select id="ai-model-select" onchange="saveConfig()" style="margin-bottom:10px;">
                <option value="gemini-2.0-flash">Google Gemini 2.0 Flash</option>
                <option value="gemini-2.5-flash">Google Gemini 2.5 Flash</option>
                <option value="gemini-3.0-flash">Google Gemini 3.0 Flash</option>
                <option value="gpt-4o-mini">OpenAI GPT-4o-mini</option>
            </select>
            <button class="btn btn-ai" onclick="generate10SentencesWithAI()">🪄 AI 10문제 자동 생성</button>
            <div id="ai-loading" class="loading">⏳ 생성 중...</div>
        </div>

        <h4 style="border-top:2px solid #eee; padding-top:20px;">등록된 목록 (<span id="folder-count">0</span>)</h4>
        <ul id="admin-sentence-list" style="padding-left:0; list-style:none;"></ul>
        <button class="btn back-btn" onclick="switchView('admin-folder')">폴더 목록으로</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, remove, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4EJ_I6cHDZZNWvUojTl5PErfdZ4OQ2IU",
            authDomain: "planb-26263.firebaseapp.com",
            databaseURL: "https://planb-26263-default-rtdb.firebaseio.com",
            projectId: "planb-26263",
            storageBucket: "planb-26263.firebasestorage.app",
            messagingSenderId: "471806067128",
            appId: "1:471806067128:web:140ecae721f2e147a04f4d"
        };

        const db = getDatabase(initializeApp(firebaseConfig));
        let sentenceData = [], folderList = [], isAdminLoggedIn = false, selectedAdminFolder = "", currentIndex = 0;

        window.onload = () => {
            document.getElementById('api-key-input').value = localStorage.getItem('api_key') || '';
            document.getElementById('ai-model-select').value = localStorage.getItem('ai_model') || 'gemini-2.0-flash';
        };

        window.saveConfig = () => {
            localStorage.setItem('api_key', document.getElementById('api-key-input').value);
            localStorage.setItem('ai_model', document.getElementById('ai-model-select').value);
        };

        onValue(ref(db, 'sentences'), (snapshot) => {
            sentenceData = []; folderList = [];
            if (snapshot.exists()) {
                snapshot.forEach((s) => {
                    const item = s.val();
                    sentenceData.push({ id: s.key, ...item });
                    if (!folderList.includes(item.expression)) folderList.push(item.expression);
                });
            }
            renderViews();
        });

        window.generate10SentencesWithAI = async () => {
            const model = document.getElementById('ai-model-select').value;
            const apiKey = document.getElementById('api-key-input').value;
            if(!apiKey) { alert("API Key가 필요합니다."); return; }
            document.getElementById('ai-loading').style.display = "block";

            const prompt = `핵심 표현 '${selectedAdminFolder}'를 포함한 자연스러운 영어 문장 10개와 뜻을 아래 JSON 형식으로만 응답해. [{"eng": "...", "kor": "..."}]`;
            
            let url, body;
            if(model.startsWith('gemini')) {
                url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                body = { contents: [{ parts: [{ text: prompt }] }] };
            } else {
                url = 'https://api.openai.com/v1/chat/completions';
                body = { model: "gpt-4o-mini", messages: [{ role: "user", content: prompt }] };
            }

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', ...(model.includes('gpt') && {'Authorization': `Bearer ${apiKey}`}) },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                const text = model.startsWith('gemini') ? data.candidates[0].content.parts[0].text : data.choices[0].message.content;
                const results = JSON.parse(text.replace(/```json|```/g, ""));
                results.forEach(i => push(ref(db, 'sentences'), { ...i, expression: selectedAdminFolder }));
                alert("생성 완료!");
            } catch(e) { alert("오류: " + e.message); }
            document.getElementById('ai-loading').style.display = "none";
        };

        // UI 렌더링 함수들 및 추가 로직들 생략(기존과 동일)...
        window.switchView = (view) => {
            document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
            document.getElementById(view + '-view').classList.remove('hidden');
        };
        
        // ... (toggleAdminAuth, renderStudentExpressionList 등 기존 로직 유지)
    </script>
</body>
</html>
