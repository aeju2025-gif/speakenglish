<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 자동 출제 & Firebase 영어 학습 앱</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --card-color: #ffffff;
            --admin-color: #e53935;
        }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .top-bar { max-width: 95%; width: 100%; display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .admin-login-btn { background-color: #78909c; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        
        .container {
            max-width: 95%; width: 100%; background: var(--card-color);
            padding: 40px; border-radius: 16px; box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            box-sizing: border-box; margin-bottom: 20px;
        }
        h2 { text-align: center; color: #333; margin-top: 0; font-size: 32px; margin-bottom: 20px; }
        .sub-desc { color:#666; font-size:18px; text-align: center; margin-bottom: 25px; }

        .btn { background-color: var(--primary-color); color: white; border: none; padding: 15px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 18px; }
        .btn:hover { opacity: 0.9; }
        .btn-ai { background-color: #8e44ad; width: 100%; } 
        
        .admin-header { border-bottom: 3px solid var(--admin-color); padding-bottom: 15px; margin-bottom: 25px; color: var(--admin-color); font-size: 32px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 18px; }
        .form-group input, .form-group select { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 18px; }
        .folder-badge { background: #ffebee; color: #c62828; padding: 10px 20px; border-radius: 6px; font-weight: bold; display: inline-block; margin-bottom: 25px; font-size: 18px; }
        
        .hidden { display: none !important; }
        .expression-list { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .expression-item { background: #e3f2fd; color: #0d47a1; padding: 20px 30px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 22px; border: 1px solid #bbdefb; display: flex; justify-content: space-between; align-items: center; }
        .expression-item:hover { background: #1976d2; color: white; }
        .count-tag { background: rgba(0,0,0,0.1); padding: 4px 12px; border-radius: 16px; font-size: 16px; }
        
        .card { border: 2px solid #e0e0e0; padding: 60px 40px; border-radius: 12px; text-align: center; margin: 30px 0; background: #fafafa; }
        .sentence { font-size: 36px; line-height: 2.0; letter-spacing: 0.5px; word-break: break-word; color: #222; }
        .meaning { font-size: 26px; color: #555; margin-top: 40px; border-top: 2px dashed #ddd; padding-top: 30px; }
        
        .expression-highlight { color: #2e7d32; font-weight: bold; border-bottom: 4px solid #4caf50; padding: 0 6px; background-color: #e8f5e9; border-radius: 6px; }
        .blank { display: inline-block; border-bottom: 3px solid #444; color: transparent; padding: 0 6px; margin: 0 4px; cursor: pointer; user-select: none; transition: color 0.1s; }
        .blank:active, .blank.reveal { color: #333333; }
        
        .nav-btns { display: flex; justify-content: space-between; margin-top: 30px; }
        .back-btn { background: #757575; }
        #page-info { align-self: center; font-weight: bold; font-size: 20px; }
        
        .loading { display: none; text-align: center; font-size: 20px; color: #8e44ad; font-weight: bold; margin: 15px 0; }
        
        .action-btn { padding: 6px 12px; font-size: 15px; margin-left: 10px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-edit { background: #ff9800; }
        .btn-delete { background: #ef5350; }

        .ai-controls { display: flex; gap: 15px; margin-bottom: 15px; }
        .ai-controls select { flex: 1; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button id="auth-btn" class="admin-login-btn" onclick="toggleAdminAuth()">🔒 관리자 로그인</button>
    </div>

    <div id="main-view" class="container">
        <h2>📚 핵심 표현 목록</h2>
        <p class="sub-desc">학습할 핵심 표현을 선택하면 문장 연습이 시작됩니다.</p>
        <div id="loading-data" style="text-align:center; color:#666;">데이터를 불러오는 중입니다...</div>
        <div class="expression-list" id="main-expression-list"></div>
    </div>

    <div id="study-view" class="container hidden">
        <h2 id="study-title">핵심 표현 학습</h2>
        <div class="card">
            <div class="sentence" id="study-sentence"></div>
            <div class="meaning" id="study-meaning"></div>
        </div>
        <p style="text-align:center; font-size:16px; color:#999;">💡 빈칸(밑줄)을 손가락으로 터치하고 있으면 원래 단어가 나타납니다.</p>
        <div class="nav-btns">
            <button class="btn back-btn" onclick="switchView('main')">목록으로</button>
            <span id="page-info">1 / 1</span>
            <button class="btn" id="next-btn" onclick="nextSentence()">다음 문장 ➡️</button>
        </div>
    </div>

    <div id="admin-folder-view" class="container hidden">
        <h2 class="admin-header">🔧 표현 폴더 관리 (관리자)</h2>
        <div class="form-group" style="background: #f0f4f8; padding: 15px; border-radius: 8px; margin-bottom: 25px;">
            <label style="font-size:15px; color:#555;">🔑 API Key (Gemini 또는 OpenAI)</label>
            <input type="password" id="api-key-input" placeholder="sk-... 또는 AI Key" style="padding:10px; font-size:15px; margin-top:5px;" onchange="saveConfig()">
        </div>
        <div class="form-group" style="display:flex; gap:15px; margin-bottom: 25px;">
            <input type="text" id="new-folder-name" placeholder="새로운 핵심 표현 입력 (예: want to)">
            <button class="btn" onclick="createNewFolder()" style="background:#4caf50; white-space:nowrap;">폴더 생성</button>
        </div>
        <div class="expression-list" id="admin-folder-list"></div>
    </div>

    <div id="admin-register-view" class="container hidden">
        <h2 class="admin-header">📝 문제 등록 및 관리</h2>
        <div class="folder-badge">현재 폴더 표현: <span id="current-folder-title"></span></div>
        
        <div style="background: #f3e5f5; padding: 20px; border-radius: 12px; border: 2px dashed #8e44ad; margin-bottom: 25px;">
            <span style="font-size: 18px; font-weight: bold; color: #8e44ad;">🤖 AI 추천 문장 10개 자동 생성 및 등록</span>
            <p style="margin: 5px 0 15px 0; color: #666; font-size: 14px;">선택한 AI 모델과 난이도를 설정해 예문을 즉시 생성합니다.</p>
            
            <div class="ai-controls">
                <select id="ai-model-select" onchange="saveConfig()">
                    <option value="gemini-2.0-flash">Google Gemini 2.0 Flash</option>
                    <option value="gemini-2.5-flash">Google Gemini 2.5 Flash</option>
                    <option value="gemini-3.0-flash">Google Gemini 3.0 Flash</option>
                    <option value="gpt-4o-mini">OpenAI GPT-4o-mini</option>
                </select>
                
                <select id="difficulty-select">
                    <option value="low">🌱 난이도: 하 (초보/짧은 문장)</option>
                    <option value="medium" selected>🌿 난이도: 중 (일상/보통 길이)</option>
                    <option value="high">🌳 난이도: 상 (비즈니스/복잡한 문장)</option>
                </select>
            </div>

            <button class="btn btn-ai" onclick="generate10SentencesWithAI()">🪄 AI로 새로운 10문제 자동 생성하기</button>
            <div id="ai-loading" class="loading">⏳ AI가 문장을 생성 중입니다...</div>
        </div>

        <div style="border: 1px solid #ddd; padding: 20px; border-radius: 12px; margin-bottom: 25px;">
            <label style="font-weight:bold; font-size:18px; color:#333; display:block; margin-bottom:15px;">✍️ 수동으로 문제 등록하기</label>
            <div class="form-group"><input type="text" id="input-eng" placeholder="영어 문장 입력 (예: I want to eat pizza.)"></div>
            <div class="form-group"><input type="text" id="input-kor" placeholder="뜻 입력 (예: 나는 피자를 먹고 싶다.)"></div>
            <button class="btn" style="background:var(--admin-color);" onclick="addSentence()">수동 등록</button>
            <button class="btn back-btn" onclick="switchView('admin-folder')" style="margin-left:10px;">폴더 목록으로</button>
        </div>
        
        <h4 style="margin-top:35px; border-top:2px solid #eee; padding-top:20px; font-size: 22px;">등록된 문제 목록 (<span id="folder-count">0</span>)</h4>
        <ul id="admin-sentence-list" style="padding-left:0; list-style:none; font-size:18px; color:#555; line-height: 2.0;"></ul>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, remove, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4EJ_I6cHDZZNWvUojTl5PErfdZ4OQ2IU",
            authDomain: "planb-26263.firebaseapp.com",
            databaseURL: "https://planb-26263-default-rtdb.firebaseio.com",
            projectId: "planb-26263",
            storageBucket: "planb-26263.firebasestorage.app",
            messagingSenderId: "471806067128",
            appId: "1:471806067128:web:140ecae721f2e147a04f4d",
            measurementId: "G-V64Q01CXT0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let sentenceData = [];
        let folderList = [];
        let isAdminLoggedIn = false;
        let selectedAdminFolder = ""; 
        let currentExpression = "";   
        let filteredSentences = [];
        let currentIndex = 0;

        window.onload = function() {
            document.getElementById('api-key-input').value = localStorage.getItem('api_key') || '';
            document.getElementById('ai-model-select').value = localStorage.getItem('ai_model') || 'gemini-2.0-flash';
        }

        window.saveConfig = function() {
            localStorage.setItem('api_key', document.getElementById('api-key-input').value.trim());
            localStorage.setItem('ai_model', document.getElementById('ai-model-select').value);
        }

        const sentencesRef = ref(db, 'sentences');
        onValue(sentencesRef, (snapshot) => {
            document.getElementById('loading-data').style.display = 'none';
            sentenceData = [];
            folderList = [];
            
            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const item = childSnapshot.val();
                    sentenceData.push({ id: childSnapshot.key, ...item });
                    if (!folderList.includes(item.expression)) {
                        folderList.push(item.expression);
                    }
                });
            }
            
            const mainViewHidden = document.getElementById('main-view').classList.contains('hidden');
            const adminFolderViewHidden = document.getElementById('admin-folder-view').classList.contains('hidden');
            const adminRegisterViewHidden = document.getElementById('admin-register-view').classList.contains('hidden');
            
            if (!mainViewHidden) renderStudentExpressionList();
            if (!adminFolderViewHidden) renderAdminFolderList();
            if (!adminRegisterViewHidden) updateAdminSentenceList();
        });

        // ================= 핵심 기능: AI 문제 생성 (난이도 적용) =================
        window.generate10SentencesWithAI = async function() {
            const apiKey = document.getElementById('api-key-input').value.trim();
            const model = document.getElementById('ai-model-select').value;
            const difficulty = document.getElementById('difficulty-select').value;
            
            if(!apiKey) {
                alert("API Key를 입력해주세요.");
                return;
            }

            const loadingEl = document.getElementById('ai-loading');
            loadingEl.style.display = "block";

            // 난이도별 프롬프트 지시사항 분기 처리
            let difficultyText = "";
            if (difficulty === "low") {
                difficultyText = "난이도: [쉬움]. 초등학생이나 영어 초보자가 쉽게 이해할 수 있는 아주 짧고 기초적인 단어로만 구성된 문장을 만들어줘.";
            } else if (difficulty === "medium") {
                difficultyText = "난이도: [보통]. 일반 성인들이 일상 대화에서 자주 쓰는 자연스러운 길이와 어휘 수준의 문장을 만들어줘.";
            } else if (difficulty === "high") {
                difficultyText = "난이도: [어려움]. 비즈니스 상황, 수능, 토익/토플 수준의 다소 길고 복잡한 문법 구조와 고급 어휘를 사용한 문장을 만들어줘.";
            }

            const promptMessage = `너는 영어 선생님이야. 핵심 표현 '${selectedAdminFolder}'를 반드시 포함하는 영어 문장 10개와 그에 맞는 한국어 번역 뜻을 만들어줘.
${difficultyText}
결과는 마크다운 없이 오직 아래 형태의 순수한 JSON 배열 형태로만 답변해.
[
    {"eng": "영어 문장 1", "kor": "한국어 뜻 1"},
    {"eng": "영어 문장 2", "kor": "한국어 뜻 2"}
]`;

            let url, body;

            if(model.startsWith('gemini')) {
                url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                body = { contents: [{ parts: [{ text: promptMessage }] }] };
            } else {
                url = 'https://api.openai.com/v1/chat/completions';
                body = { model: "gpt-4o-mini", messages: [{ role: "user", content: promptMessage }] };
            }

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        ...(model.includes('gpt') && {'Authorization': `Bearer ${apiKey}`}) 
                    },
                    body: JSON.stringify(body)
                });

                const data = await response.json();
                
                let aiText = model.startsWith('gemini') 
                    ? data.candidates[0].content.parts[0].text 
                    : data.choices[0].message.content;

                aiText = aiText.replace(/```json/g, "").replace(/```/g, "").trim();
                const aiResults = JSON.parse(aiText);
                
                if(Array.isArray(aiResults)) {
                    aiResults.forEach(item => {
                        push(ref(db, 'sentences'), {
                            eng: item.eng,
                            expression: selectedAdminFolder,
                            kor: item.kor
                        });
                    });
                    const diffLabel = difficulty === 'low' ? '하' : difficulty === 'medium' ? '중' : '상';
                    alert(`난이도 [${diffLabel}] 수준으로 10개의 문제가 생성되었습니다!`);
                } else {
                    alert("AI 응답 형식이 올바르지 않습니다.");
                }
            } catch (error) {
                alert("오류가 발생했습니다: " + error.message);
            } finally {
                loadingEl.style.display = "none";
            }
        }

        // ================= UI 및 학생/관리자 로직 =================
        window.switchView = function(viewId) {
            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('study-view').classList.add('hidden');
            document.getElementById('admin-folder-view').classList.add('hidden');
            document.getElementById('admin-register-view').classList.add('hidden');
            document.getElementById(viewId + '-view').classList.remove('hidden');
            
            if(viewId === 'main') renderStudentExpressionList();
            if(viewId === 'admin-folder') renderAdminFolderList();
        }

        window.toggleAdminAuth = function() {
            if (!isAdminLoggedIn) {
                const password = prompt("관리자 비밀번호를 입력하세요:");
                if (password === "1234") {
                    isAdminLoggedIn = true;
                    document.getElementById('auth-btn').innerText = "🔓 로그아웃 (학생 모드)";
                    document.getElementById('auth-btn').style.backgroundColor = "#e53935";
                    switchView('admin-folder');
                }
            } else {
                isAdminLoggedIn = false;
                document.getElementById('auth-btn').innerText = "🔒 관리자 로그인";
                document.getElementById('auth-btn').style.backgroundColor = "#78909c";
                switchView('main');
            }
        }

        window.createNewFolder = function() {
            const folderName = document.getElementById('new-folder-name').value.trim();
            if(!folderName) return;
            if(folderList.some(f => f.toLowerCase() === folderName.toLowerCase())) {
                alert("이미 존재하는 폴더입니다.");
                return;
            }
            push(ref(db, 'sentences'), { eng: `I ${folderName} it.`, expression: folderName, kor: "새로 생성된 표현 샘플입니다." });
            document.getElementById('new-folder-name').value = "";
        }

        window.renderAdminFolderList = function() {
            const listEl = document.getElementById('admin-folder-list');
            listEl.innerHTML = "";
            folderList.forEach(folder => {
                const count = sentenceData.filter(item => item.expression.toLowerCase() === folder.toLowerCase()).length;
                const itemDiv = document.createElement('div');
                itemDiv.className = 'expression-item';
                itemDiv.style.background = "#fff3e0"; itemDiv.style.color = "#e65100";
                itemDiv.innerHTML = `<span>📂 <b>${folder}</b></span> <span class="count-tag">${count}개 문제</span>`;
                itemDiv.onclick = function() { enterFolder(folder); };
                listEl.appendChild(itemDiv);
            });
        }

        window.enterFolder = function(folderName) {
            selectedAdminFolder = folderName;
            document.getElementById('current-folder-title').innerText = folderName;
            switchView('admin-register');
            updateAdminSentenceList();
        }

        window.addSentence = function() {
            const eng = document.getElementById('input-eng').value.trim();
            const kor = document.getElementById('input-kor').value.trim();
            if(!eng || !kor) { alert("빈칸을 채워주세요!"); return; }
            if(!eng.toLowerCase().includes(selectedAdminFolder.toLowerCase())) {
                alert(`문장에 핵심 표현 [ ${selectedAdminFolder} ] 가 포함되어야 합니다.`);
                return;
            }
            push(ref(db, 'sentences'), { eng, expression: selectedAdminFolder, kor });
            document.getElementById('input-eng').value = "";
            document.getElementById('input-kor').value = "";
        }

        window.editSentence = function(id, currentEng, currentKor) {
            const newEng = prompt("수정할 영어 문장을 입력하세요:", currentEng);
            if(newEng === null) return; 
            const newKor = prompt("수정할 뜻을 입력하세요:", currentKor);
            if(newKor === null) return;

            if(!newEng.toLowerCase().includes(selectedAdminFolder.toLowerCase())) {
                alert(`문장에 핵심 표현 [ ${selectedAdminFolder} ] 가 포함되어야 합니다.`);
                return;
            }

            update(ref(db, 'sentences/' + id), {
                eng: newEng.trim(),
                kor: newKor.trim()
            });
        }

        window.deleteSentence = function(id) {
            if(confirm("이 문제를 정말 삭제하시겠습니까?")) {
                remove(ref(db, 'sentences/' + id));
            }
        }

        window.updateAdminSentenceList = function() {
            const listEl = document.getElementById('admin-sentence-list');
            const countEl = document.getElementById('folder-count');
            listEl.innerHTML = "";
            const currentFolderData = sentenceData.filter(item => item.expression.toLowerCase() === selectedAdminFolder.toLowerCase());
            countEl.innerText = currentFolderData.length;
            
            currentFolderData.forEach(item => {
                const li = document.createElement('li');
                li.style.marginBottom = "15px";
                li.style.borderBottom = "1px solid #eee";
                li.style.paddingBottom = "10px";
                li.innerHTML = `
                    <div style="margin-bottom:5px;"><strong>${item.eng}</strong></div>
                    <div style="color:#888; margin-bottom:10px;">${item.kor}</div>
                    <div>
                        <button class="action-btn btn-edit" onclick="editSentence('${item.id}', '${item.eng.replace(/'/g, "\\'")}', '${item.kor.replace(/'/g, "\\'")}')">✏️ 수정</button>
                        <button class="action-btn btn-delete" onclick="deleteSentence('${item.id}')">🗑️ 삭제</button>
                    </div>
                `;
                listEl.appendChild(li);
            });
        }

        // --- 학생: 표현 목록 및 학습 ---
        window.renderStudentExpressionList = function() {
            const listEl = document.getElementById('main-expression-list');
            listEl.innerHTML = "";
            if(folderList.length === 0) { listEl.innerHTML = "<p style='text-align:center;'>등록된 문제가 없습니다.</p>"; return; }
            folderList.forEach(exp => {
                const count = sentenceData.filter(item => item.expression === exp).length;
                const itemDiv = document.createElement('div');
                itemDiv.className = 'expression-item';
                itemDiv.innerHTML = `<span>💡 <b>${exp}</b></span> <span class="count-tag">${count}개 문장</span>`;
                itemDiv.onclick = function() { startStudy(exp); };
                listEl.appendChild(itemDiv);
            });
        }

        window.startStudy = function(expression) {
            currentExpression = expression;
            filteredSentences = sentenceData.filter(item => item.expression.toLowerCase() === expression.toLowerCase());
            currentIndex = 0;
            document.getElementById('study-title').innerText = `표현 학습: ${expression}`;
            switchView('study');
            renderStudyCard();
        }

        window.renderStudyCard = function() {
            if(filteredSentences.length === 0) return;
            const currentItem = filteredSentences[currentIndex];
            const sentenceEl = document.getElementById('study-sentence');
            const meaningEl = document.getElementById('study-meaning');
            document.getElementById('page-info').innerText = `${currentIndex + 1} / ${filteredSentences.length}`;

            let rawEng = currentItem.eng;
            const targetExp = currentItem.expression;
            const escapeRegExp = (str) => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            
            let words = targetExp.trim().split(/\s+/);
            let firstWord = escapeRegExp(words[0].toLowerCase());
            
            let verbRegex = firstWord;
            if (firstWord === 'have') verbRegex = '(have|has|had|having)';
            else if (firstWord === 'do') verbRegex = '(do|does|did|doing)';
            else if (firstWord === 'be') verbRegex = '(be|am|is|are|was|were|been|being)';
            else if (firstWord === 'go') verbRegex = '(go|goes|went|gone|going)';
            else verbRegex = `${firstWord}(s|es|d|ed|ing)?`; 

            words[0] = verbRegex;
            let restOfWords = words.slice(1).map(escapeRegExp).join('\\s+');
            let regexStr = restOfWords ? `\\b${verbRegex}\\s+${restOfWords}\\b` : `\\b${verbRegex}\\b`;
            const expRegex = new RegExp(regexStr, 'gi');

            let matchTexts = [];
            rawEng = rawEng.replace(expRegex, (match) => { 
                matchTexts.push(match); 
                return "___EXPRESSION_PLACEHOLDER___"; 
            });

            const tokens = rawEng.split(/(\s+)/);
            let processedHTML = "";
            tokens.forEach(token => {
                if (token.trim() === "") processedHTML += token;
                else if (token === "___EXPRESSION_PLACEHOLDER___") {
                    processedHTML += `<span class="expression-highlight">${matchTexts.shift()}</span>`;
                }
                else {
                    const match = token.match(/^([a-zA-Z0-9'-]+)([^a-zA-Z0-9'-]*)$/);
                    if (match) {
                        processedHTML += `<span class="blank" ontouchstart="toggleBlank(this, true)" ontouchend="toggleBlank(this, false)" onmousedown="toggleBlank(this, true)" onmouseup="toggleBlank(this, false)">${match[1]}</span>${match[2]}`;
                    } else processedHTML += token;
                }
            });
            
            sentenceEl.innerHTML = processedHTML;
            meaningEl.innerText = currentItem.kor;
            document.getElementById('next-btn').innerText = (currentIndex === filteredSentences.length - 1) ? "학습 완료" : "다음 문장 ➡️";
        }

        window.toggleBlank = function(element, isShow) { 
            if(isShow) element.classList.add('reveal'); else element.classList.remove('reveal'); 
        }
        
        window.nextSentence = function() {
            if(currentIndex < filteredSentences.length - 1) { 
                currentIndex++; renderStudyCard(); 
            } else { 
                alert(`'${currentExpression}' 학습 완료!`); 
                switchView('main'); 
            }
        }
    </script>
</body>
</html>
